name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: .NET セットアップ
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: シングルファイル発行
      shell: pwsh
      run: |
        $proj = (Get-ChildItem -Filter *.csproj -Recurse | Select-Object -First 1).FullName
        Write-Host "Publishing project: $proj"
        dotnet publish $proj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: 配布用パッケージ (Zip) の作成
      shell: pwsh
      run: |
        $distDir = "./M3U_Radio_Player"
        if (Test-Path $distDir) {
            Remove-Item -Path $distDir -Recurse -Force
        }
        New-Item -ItemType Directory -Path $distDir -Force | Out-Null

        # 1. dotnet publish の出力物（exe、wpf関連dll等）をコピー
        Copy-Item -Path "./publish/*" -Destination $distDir/ -Recurse -Force

        # 2. リポジトリ内の BASS ライブラリ、アイコン、Readme、m3u を明示的にコピー
        $copyTargets = @("bass.dll", "bassasio.dll", "bassflac.dll", "M3U Radio Player.ico", "README.md")
        foreach ($file in $copyTargets) {
            $found = Get-ChildItem -Filter $file -Recurse -File | Where-Object { $_.FullName -notmatch '\\(bin|obj|publish|M3U_Radio_Player)\\' } | Select-Object -First 1
            if ($found) {
                Copy-Item -Path $found.FullName -Destination $distDir/ -Force
                Write-Host "Included: $($found.Name)"
            }
        }

        # プレイリスト (*.m3u) のコピー
        Get-ChildItem -Filter "*.m3u" -Recurse -File | Where-Object { $_.FullName -notmatch '\\(bin|obj|publish|M3U_Radio_Player)\\' } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $distDir/ -Force
            Write-Host "Included playlist: $($_.Name)"
        }

        # 不要なデバッグシンボル (pdb) を削除
        Get-ChildItem -Path $distDir -Filter "*.pdb" | Remove-Item -Force

        # 3. Zip 圧縮
        $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
        Compress-Archive -Path "$distDir/*" -DestinationPath "./M3U_Radio_Player_$ver.zip" -Force
        
    - name: GitHub Releases へアップロード
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./M3U_Radio_Player_*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
