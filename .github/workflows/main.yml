name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: リポジトリのチェックアウト
      uses: actions/checkout@v4

    - name: .NET セットアップ
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: シングルファイル発行
      shell: pwsh
      run: |
        $proj = (Get-ChildItem -Filter *.csproj -Recurse | Select-Object -First 1).FullName
        Write-Host "Publishing project: $proj"
        dotnet publish $proj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: 配布用パッケージ (Zip) の作成
      shell: pwsh
      run: |
        $distDir = "./M3U_Radio_Player"
        if (Test-Path $distDir) { Remove-Item $distDir -Recurse -Force }
        New-Item -ItemType Directory -Path $distDir -Force

        # 1. dotnet publish で生成された全成果物 (exe, wpf系ネイティブdll含む) を丸ごとコピー
        Copy-Item -Path "./publish/*" -Destination $distDir/ -Recurse -Force

        # 2. リポジトリルートにある BASS DLL / アイコン / Readme / プレイリストを上書き・追加コピー
        Get-ChildItem -Filter "*.dll" | Where-Object { $_.DirectoryName -eq (Get-Location).Path } | Copy-Item -Destination $distDir/ -Force
        Get-ChildItem -Filter "*.ico" | Where-Object { $_.DirectoryName -eq (Get-Location).Path } | Copy-Item -Destination $distDir/ -Force
        Get-ChildItem -Filter "*.m3u" | Where-Object { $_.DirectoryName -eq (Get-Location).Path } | Copy-Item -Destination $distDir/ -Force
        if (Test-Path "README.md") { Copy-Item "README.md" -Destination $distDir/ -Force }

        # 不要なデバッグ用シンボル (pdb) を除外
        Get-ChildItem -Path $distDir -Filter "*.pdb" | Remove-Item -Force

        # Zip 圧縮
        $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
        Compress-Archive -Path "$distDir/*" -DestinationPath "./M3U_Radio_Player_$ver.zip" -Force

    - name: GitHub Releases へアップロード
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ./M3U_Radio_Player_*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}